[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "veqtor-workspace"
version = "0.1.4"
description = "Let your AI assistant read, edit and save your local documents"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["mcp==2.2.0", "anyio>=4.5,<5", "lxml>=6.1,<7", "python-docx>=1.2,<2", "pypdf>=7,<8"]

[project.urls]
Homepage = "https://veqtor.pro"
Documentation = "https://veqtor.pro/setup"
Repository = "https://github.com/JohnDeer-ai/veqtor-workspace"
Issues = "https://github.com/JohnDeer-ai/veqtor-workspace/issues"

[dependency-groups]
dev = ["pytest>=8,<10", {include-group = "installer"}]
installer = ["tomlkit==0.13.3"]

[project.scripts]
veqtor-workspace = "veqtor_workspace.server:main"

[tool.hatch.build.targets.wheel]
packages = ["veqtor_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# These dependencies contain native code. Installation must never silently
# require a user to install Rust, Xcode or OpenSSL development libraries.
no-build-package = ["cryptography", "cffi", "lxml", "pydantic-core", "rpds-py"]
