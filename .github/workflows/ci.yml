name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Mac package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.28"
      - name: Check locked dependencies
        run: uv lock --check
      - name: Run document and lifecycle tests
        run: uv run --frozen pytest -q
      - name: Build the public extension
        run: uv run --frozen python packaging/build_mcpb.py --out dist
      - name: Validate the extension manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/manifest.json
      - name: Install dependencies without compilers and launch the exact package
        run: uv run --frozen python packaging/smoke_mcpb.py dist/veqtor-workspace-*-macos-arm64.mcpb
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uvx pip-audit==2.10.1 --requirement /tmp/runtime-requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: Save the tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veqtor-workspace-${{ matrix.os }}
          path: dist/*.mcpb
          if-no-files-found: error
